<style>
  :root {
    --bg-main: #f8fafc;
    --card-bg: #ffffff;
    --primary: #1e3a8a;
    --primary-hover: #172554;
    --primary-light: #eff6ff;
    --secondary: #475569;
    --border: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --success-bg: #ecfdf5;
    --success-text: #065f46;
    --success-border: #10b981;
    --warning-bg: #fffbeb;
    --warning-text: #92400e;
    --warning-border: #f59e0b;
    --danger-bg: #fef2f2;
    --danger-text: #991b1b;
    --danger-border: #ef4444;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --radius: 8px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    line-height: 1.5;
    padding: 24px 16px;
  }

  .container {
    max-width: 1040px;
    margin: 0 auto;
  }

  /* Header */
  .app-header {
    background: var(--card-bg);
    padding: 20px 24px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .app-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .app-badge {
    background: var(--primary-light);
    color: var(--primary);
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 9999px;
    font-weight: 600;
  }

  .user-badge {
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  /* Stepper */
  .stepper {
    display: flex;
    justify-content: space-between;
    margin-bottom: 24px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    box-shadow: var(--shadow-sm);
  }

  .step-item {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-muted);
    font-weight: 500;
    font-size: 0.9rem;
    cursor: pointer;
  }

  .step-item.active {
    color: var(--primary);
    font-weight: 700;
  }

  .step-item.completed {
    color: var(--success-text);
  }

  .step-number {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--border);
    color: var(--secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
  }

  .step-item.active .step-number {
    background: var(--primary);
    color: #ffffff;
  }

  .step-item.completed .step-number {
    background: var(--success-border);
    color: #ffffff;
  }

  /* Card Container */
  .wizard-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 28px;
    margin-bottom: 24px;
  }

  .card-header {
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 20px;
  }

  .card-title {
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text-main);
  }

  .card-desc {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* Formulários */
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-label {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--secondary);
  }

  .form-control {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
    background: #fff;
    color: var(--text-main);
    outline: none;
    transition: border-color 0.15s ease-in-out;
  }

  .form-control:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
  }

  .form-control[readonly] {
    background: #f1f5f9;
    color: var(--secondary);
    cursor: not-allowed;
  }

  /* Upload Area */
  .upload-area {
    border: 2px dashed #cbd5e1;
    border-radius: var(--radius);
    padding: 36px 20px;
    text-align: center;
    background: #f8fafc;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-bottom: 20px;
  }

  .upload-area:hover, .upload-area.dragover {
    border-color: var(--primary);
    background: var(--primary-light);
  }

  .upload-icon {
    font-size: 2.2rem;
    margin-bottom: 10px;
    color: var(--primary);
  }

  .upload-text {
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 4px;
  }

  .upload-subtext {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  /* Alertas */
  .alert-box {
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 0.88rem;
    margin-bottom: 16px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    line-height: 1.4;
  }

  .alert-warning {
    background: var(--warning-bg);
    color: var(--warning-text);
    border-left: 4px solid var(--warning-border);
  }

  .alert-info {
    background: var(--primary-light);
    color: var(--primary);
    border-left: 4px solid var(--primary);
  }

  /* Botões */
  .btn-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
    padding-top: 20px;
    margin-top: 24px;
  }

  .btn {
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: background 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
  }

  .btn-primary:hover {
    background: var(--primary-hover);
  }

  .btn-secondary {
    background: #e2e8f0;
    color: var(--secondary);
  }

  .btn-secondary:hover {
    background: #cbd5e1;
  }

  .btn-success {
    background: #059669;
    color: #fff;
  }

  .btn-success:hover {
    background: #047857;
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* Semáforo de Viabilidade */
  .semaforo-card {
    padding: 20px;
    border-radius: var(--radius);
    margin-bottom: 24px;
    border-left: 6px solid transparent;
  }

  .semaforo-verde {
    background: var(--success-bg);
    color: var(--success-text);
    border-left-color: var(--success-border);
  }

  .semaforo-amarelo {
    background: var(--warning-bg);
    color: var(--warning-text);
    border-left-color: var(--warning-border);
  }

  .semaforo-vermelho {
    background: var(--danger-bg);
    color: var(--danger-text);
    border-left-color: var(--danger-border);
  }

  .semaforo-header {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .semaforo-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
  }

  .semaforo-verde .semaforo-dot { background: var(--success-border); }
  .semaforo-amarelo .semaforo-dot { background: var(--warning-border); }
  .semaforo-vermelho .semaforo-dot { background: var(--danger-border); }

  .semaforo-desc {
    font-size: 0.95rem;
    margin-bottom: 12px;
  }

  .semaforo-legal {
    font-size: 0.78rem;
    opacity: 0.85;
    font-style: italic;
  }

  /* Métricas Rápidas */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }

  .metric-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    box-shadow: var(--shadow-sm);
  }

  .metric-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--text-muted);
  }

  .metric-val {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--primary);
    margin-top: 4px;
  }

  .metric-sub {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* Tabela de Cenários */
  .table-responsive {
    overflow-x: auto;
    margin-bottom: 24px;
  }

  .cenarios-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
    text-align: left;
  }

  .cenarios-table th {
    background: #f1f5f9;
    color: var(--secondary);
    padding: 10px 12px;
    font-weight: 600;
    border-bottom: 2px solid var(--border);
  }

  .cenarios-table td {
    padding: 12px;
    border-bottom: 1px solid var(--border);
  }

  .cenarios-table tr:hover {
    background: #f8fafc;
  }

  .cenarios-table tr.destaque {
    background: #eff6ff;
    font-weight: 600;
  }

  /* Gráfico em Barras CSS */
  .bar-chart-container {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px;
    margin-bottom: 24px;
  }

  .bar-group {
    margin-bottom: 14px;
  }

  .bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .bar-track {
    background: #e2e8f0;
    height: 20px;
    border-radius: 4px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.6s ease;
  }

  /* Spinner */
  .spinner-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 9999;
    color: #fff;
  }

  .spinner {
    width: 48px;
    height: 48px;
    border: 5px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: #ffffff;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 640px) {
    .stepper {
      flex-direction: column;
      gap: 12px;
    }
    .form-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
